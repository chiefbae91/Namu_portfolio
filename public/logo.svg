<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="clip"><circle cx="50" cy="50" r="49"/></clipPath>

    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a5c4e"/>
      <stop offset="100%" stop-color="#0a2820"/>
    </radialGradient>

    <radialGradient id="face" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#d4721c"/>
      <stop offset="55%" stop-color="#a84010"/>
      <stop offset="100%" stop-color="#6a2208"/>
    </radialGradient>

    <radialGradient id="muzzle" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#e8a864"/>
      <stop offset="100%" stop-color="#c07030"/>
    </radialGradient>

    <radialGradient id="iris" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#d8ff20"/>
      <stop offset="40%" stop-color="#6cc800"/>
      <stop offset="80%" stop-color="#1e6600"/>
      <stop offset="100%" stop-color="#0a2800"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <!-- Ears -->
    <polygon points="14,50 26,4 40,46" fill="#b85c14"/>
    <polygon points="18,48 26,12 36,45" fill="#f0dcc0" opacity="0.45"/>

    <polygon points="60,46 74,4 86,50" fill="#8a3208"/>
    <polygon points="64,45 74,12 82,48" fill="#f0dcc0" opacity="0.45"/>

    <!-- Head -->
    <ellipse cx="50" cy="60" rx="39" ry="44" fill="url(#face)"/>

    <!-- Dark cheek patches (painting's red-dark zones) -->
    <ellipse cx="32" cy="52" rx="14" ry="16" fill="#8a1c08" opacity="0.45"/>
    <ellipse cx="68" cy="52" rx="14" ry="16" fill="#8a1c08" opacity="0.35"/>

    <!-- Forehead stripes -->
    <path d="M45 18 Q44 32 44 44" stroke="#28100a" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M50 16 Q50 30 50 42" stroke="#28100a" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M55 18 Q56 32 56 44" stroke="#28100a" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>

    <!-- Eye glow halos -->
    <ellipse cx="33" cy="54" rx="15" ry="14" fill="#4a9020" opacity="0.18" filter="url(#glow)"/>
    <ellipse cx="67" cy="54" rx="15" ry="14" fill="#4a9020" opacity="0.18" filter="url(#glow)"/>

    <!-- Eyes -->
    <ellipse cx="33" cy="54" rx="13.5" ry="12.5" fill="url(#iris)"/>
    <ellipse cx="67" cy="54" rx="13.5" ry="12.5" fill="url(#iris)"/>

    <!-- Pupils (vertical slit) -->
    <ellipse cx="33" cy="54" rx="5" ry="12" fill="#060a06"/>
    <ellipse cx="67" cy="54" rx="5" ry="12" fill="#060a06"/>

    <!-- Eye rim -->
    <ellipse cx="33" cy="54" rx="13.5" ry="12.5" fill="none" stroke="#1a4010" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="67" cy="54" rx="13.5" ry="12.5" fill="none" stroke="#1a4010" stroke-width="1.2" opacity="0.6"/>

    <!-- Catchlights -->
    <circle cx="37" cy="49" r="3" fill="white" opacity="0.92"/>
    <circle cx="71" cy="49" r="3" fill="white" opacity="0.92"/>
    <circle cx="30" cy="58" r="1.3" fill="white" opacity="0.35"/>
    <circle cx="64" cy="58" r="1.3" fill="white" opacity="0.35"/>

    <!-- Muzzle -->
    <ellipse cx="50" cy="73" rx="19" ry="14" fill="url(#muzzle)" opacity="0.75"/>

    <!-- Nose -->
    <path d="M47 71 Q50 69.5 53 71 L50 75.5 Z" fill="#e07080"/>
    <path d="M47 71 Q50 69.5 53 71" fill="none" stroke="#c05060" stroke-width="0.8"/>

    <!-- Mouth -->
    <path d="M50 75.5 Q44.5 80 41 78" fill="none" stroke="#3a1408" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M50 75.5 Q55.5 80 59 78" fill="none" stroke="#3a1408" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Whiskers left -->
    <line x1="0"  y1="64" x2="36" y2="70" stroke="white" stroke-width="1.3" opacity="0.80" stroke-linecap="round"/>
    <line x1="0"  y1="72" x2="36" y2="74" stroke="white" stroke-width="1.3" opacity="0.80" stroke-linecap="round"/>
    <line x1="2"  y1="58" x2="34" y2="66" stroke="white" stroke-width="0.9" opacity="0.50" stroke-linecap="round"/>

    <!-- Whiskers right -->
    <line x1="100" y1="64" x2="64" y2="70" stroke="white" stroke-width="1.3" opacity="0.80" stroke-linecap="round"/>
    <line x1="100" y1="72" x2="64" y2="74" stroke="white" stroke-width="1.3" opacity="0.80" stroke-linecap="round"/>
    <line x1="98"  y1="58" x2="66" y2="66" stroke="white" stroke-width="0.9" opacity="0.50" stroke-linecap="round"/>

  </g>

  <!-- Border ring -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#2a8868" stroke-width="1.8"/>
</svg>
