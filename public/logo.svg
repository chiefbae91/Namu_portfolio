<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="logoClip">
      <circle cx="50" cy="50" r="49"/>
    </clipPath>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="catGrad" cx="50" cy="38" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d63ee"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="49" fill="url(#bgGrad)"/>

  <g clip-path="url(#logoClip)">
    <!-- Left ear outer (navy, arrow-like) -->
    <path d="M 18 54 L 28 8 L 42 54 Z" fill="url(#catGrad)"/>
    <!-- Left ear inner (gold accent) -->
    <path d="M 22 52 L 28 12 L 38 52 Z" fill="#d97706" opacity="0.88"/>

    <!-- Right ear outer -->
    <path d="M 58 54 L 72 8 L 82 54 Z" fill="url(#catGrad)"/>
    <!-- Right ear inner (gold accent) -->
    <path d="M 62 52 L 72 12 L 78 52 Z" fill="#d97706" opacity="0.88"/>

    <!-- Cat head circle (covers ear bases — seamless silhouette) -->
    <circle cx="50" cy="62" r="34" fill="url(#catGrad)"/>

    <!-- Left eye -->
    <ellipse cx="36" cy="57" rx="9.5" ry="7.5" fill="url(#eyeGrad)"/>
    <ellipse cx="36" cy="57" rx="4" ry="7" fill="#0a0f1e"/>
    <circle cx="38.5" cy="54" r="1.8" fill="white" opacity="0.9"/>

    <!-- Right eye -->
    <ellipse cx="64" cy="57" rx="9.5" ry="7.5" fill="url(#eyeGrad)"/>
    <ellipse cx="64" cy="57" rx="4" ry="7" fill="#0a0f1e"/>
    <circle cx="66.5" cy="54" r="1.8" fill="white" opacity="0.9"/>

    <!-- Nose (gold diamond — wealth symbol) -->
    <path d="M 50 65 L 53.5 70 L 50 75 L 46.5 70 Z" fill="#d97706"/>

    <!-- Mouth (confident smile) -->
    <path d="M 43 76 Q 50 84 57 76" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

    <!-- Whiskers left -->
    <line x1="7" y1="60" x2="33" y2="63" stroke="#f59e0b" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    <line x1="7" y1="69" x2="33" y2="68" stroke="#f59e0b" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

    <!-- Whiskers right -->
    <line x1="93" y1="60" x2="67" y2="63" stroke="#f59e0b" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    <line x1="93" y1="69" x2="67" y2="68" stroke="#f59e0b" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Gold ring border (rendered on top, gives premium finish) -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#d97706" stroke-width="1.5"/>
</svg>
