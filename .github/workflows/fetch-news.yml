name: Fetch Financial News

on:
  schedule:
    # 월-금 08:00-23:50 UTC (ET 프리장~애프터마켓), 10분마다
    - cron: '*/10 8-23 * * 1-5'
  workflow_dispatch: # 수동 트리거 가능

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch news
        run: |
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/fetch-news"
